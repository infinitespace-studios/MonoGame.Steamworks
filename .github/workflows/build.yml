name: Build

on:
  push:
    branches: [ MonoGame ]
  pull_request:
    branches: [ MonoGame ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/MonoGame.Steamworks.csproj
    
    - name: Build
      run: dotnet build src/MonoGame.Steamworks.csproj --configuration Release --no-restore
    
    - name: Restore test dependencies
      run: dotnet restore tests/MonoGame.Steamworks.Tests.csproj
    
    - name: Build tests
      run: dotnet build tests/MonoGame.Steamworks.Tests.csproj --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test tests/MonoGame.Steamworks.Tests.csproj --configuration Release --no-build --verbosity normal

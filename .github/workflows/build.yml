name: Build

on:
  push:
    branches: [ MonoGame ]
  pull_request:
    branches: [ MonoGame ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore src/MonoGame.Steamworks.csproj
    
    - name: Build
      run: dotnet build src/MonoGame.Steamworks.csproj --configuration Release --no-restore
